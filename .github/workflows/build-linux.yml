name: Build Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            dpkg-dev \
            rpm

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build app
        run: bash scripts/build-linux.sh --no-install

      - name: Package .deb and .rpm
        run: bash scripts/package-linux.sh

      - name: Verify Linux onboarding payload
        run: |
          deb_package=$(find dist/packages -maxdepth 1 -name '*.deb' -print -quit)
          rpm_package=$(find dist/packages -maxdepth 1 -name '*.rpm' -print -quit)

          dpkg-deb --field "$deb_package" Depends | grep -q 'ydotool'
          dpkg-deb --contents "$deb_package" | grep -q 'wis-free-v3-ydotool.service'
          dpkg-deb --contents "$deb_package" | grep -q '80-wis-free-v3-uinput.rules'

          rpm -qp --requires "$rpm_package" | grep -q 'ydotool'
          rpm -qlp "$rpm_package" | grep -q 'wis-free-v3-ydotool.service'
          rpm -qlp "$rpm_package" | grep -q '80-wis-free-v3-uinput.rules'
          if rpm -qp --requires "$rpm_package" | grep -Eq '^(gtk3|alsa-lib|webkit2gtk4\.1|libayatana-appindicator-gtk3)$'; then
            echo 'RPM contains Fedora-specific runtime package names instead of portable ABI dependencies.' >&2
            exit 1
          fi

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: wis-free-v3-linux-deb
          path: dist/packages/*.deb

      - name: Upload .rpm package
        uses: actions/upload-artifact@v4
        with:
          name: wis-free-v3-linux-rpm
          path: dist/packages/*.rpm
