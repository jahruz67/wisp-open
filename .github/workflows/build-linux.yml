name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Debian and Fedora packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            dpkg-dev \
            rpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Package .deb and .rpm
        run: bash scripts/package-linux.sh

      - name: Verify Linux onboarding payload
        run: |
          deb_package=$(find dist/packages -maxdepth 1 -name '*.deb' -print -quit)
          rpm_package=$(find dist/packages -maxdepth 1 -name '*.rpm' -print -quit)

          dpkg-deb --field "$deb_package" Depends | grep -q 'ydotool'
          dpkg-deb --contents "$deb_package" | grep -q 'wis-free-v3-ydotool.service'
          dpkg-deb --contents "$deb_package" | grep -q '80-wis-free-v3-uinput.rules'

          rpm -qp --requires "$rpm_package" | grep -q 'ydotool'
          rpm -qlp "$rpm_package" | grep -q 'wis-free-v3-ydotool.service'
          rpm -qlp "$rpm_package" | grep -q '80-wis-free-v3-uinput.rules'
          if rpm -qp --requires "$rpm_package" | grep -Eq '^(gtk3|alsa-lib|webkit2gtk4\.1|libayatana-appindicator-gtk3)$'; then
            echo 'RPM contains Fedora-specific runtime package names instead of portable ABI dependencies.' >&2
            exit 1
          fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install MinGW
        shell: pwsh
        run: |
          $msysBash = 'C:\msys64\usr\bin\bash.exe'
          $mingwBin = 'C:\msys64\mingw64\bin'
          if (-not (Test-Path -LiteralPath $msysBash)) {
            throw "MSYS2 was not found at $msysBash"
          }
          & $msysBash -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) {
            throw "MinGW installation failed with exit code $LASTEXITCODE"
          }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Windows executable
        shell: pwsh
        run: |
          $appVersion = (Get-Content -LiteralPath scripts/VERSION -Raw).Trim()
          wails build -platform windows/amd64 -clean -skipbindings -ldflags "-linkmode external -X main.AppVersion=$appVersion"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: build/bin/wis-free-v3.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Linux packages are the required release output. If the optional Windows
    # build fails, publish the Linux files now and allow a rerun to add the .exe.
    if: always() && github.event_name != 'pull_request' && needs.build-linux.result == 'success'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Create the next numbered release
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            // Re-running a workflow for the same commit should repair its release,
            // not create a duplicate release with a new number.
            const existing = releases.find(
              release => release.target_commitish === context.sha
            );
            if (existing) {
              core.info(`Reusing ${existing.tag_name} for ${context.sha}`);
              core.setOutput('tag', existing.tag_name);
              core.setOutput('url', existing.html_url);
              return;
            }

            const numbers = releases
              .map(release => /^v(\d+)$/.exec(release.tag_name))
              .filter(Boolean)
              .map(match => Number(match[1]));
            let nextNumber = Math.max(0, ...numbers) + 1;
            const commitMessage = context.payload.head_commit?.message ?? '';
            const commitSubject = commitMessage.split(/\r?\n/, 1)[0].trim();

            // Release creation also creates the tag. If two builds finish at the
            // same moment, GitHub accepts one and the other retries the next number.
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              const tag = `v${nextNumber}`;
              try {
                const { data: release } = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: commitSubject || `Release ${tag}`,
                  generate_release_notes: true,
                  draft: false,
                  prerelease: false
                });
                core.setOutput('tag', release.tag_name);
                core.setOutput('url', release.html_url);
                return;
              } catch (error) {
                const tagAlreadyExists = error.status === 422 &&
                  error.response?.data?.errors?.some(
                    item => item.code === 'already_exists'
                  );
                if (!tagAlreadyExists || attempt === 10) throw error;
                nextNumber += 1;
              }
            }

      - name: Upload Debian, Fedora, and Windows files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Show release URL
        run: echo "Published ${{ steps.release.outputs.url }}"
