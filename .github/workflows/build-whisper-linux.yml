name: Build Linux Whisper engine (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-whisper-engine-v1.9.4-r1
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libvulkan-dev spirv-headers python3 zip binutils

      - name: Set up Vulkan headers
        run: |
          git clone --depth 1 --branch v1.3.296 https://github.com/KhronosGroup/Vulkan-Headers.git build/vulkan-headers
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/build/vulkan-headers" >> "$GITHUB_ENV"

      - name: Build shader compiler
        run: |
          git clone --depth 1 --branch v2024.4 https://github.com/google/shaderc.git build/shaderc-src
          cd build/shaderc-src
          python3 utils/git-sync-deps
          cmake -S . -B out \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_EXAMPLES=ON
          cmake --build out --target glslc_exe --parallel 2
          echo "$PWD/out/glslc" >> "$GITHUB_PATH"

      - name: Build engine
        run: bash scripts/build-whisper-linux.sh

      - name: Verify and package engine
        run: |
          glibc_version=$(readelf --version-info build/bin/whisper-cli \
            | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -n1)
          if [ -z "$glibc_version" ] || dpkg --compare-versions "$glibc_version" gt 2.35; then
            echo "Engine requires glibc ${glibc_version:-unknown}; maximum supported baseline is 2.35." >&2
            exit 1
          fi
          env -u LD_LIBRARY_PATH -u LD_PRELOAD build/bin/whisper-cli --help
          mkdir -p dist/engines
          archive=whisper-linux-amd64-vulkan-v1.9.4.zip
          zip -j "dist/engines/$archive" build/bin/whisper-cli build/bin/whisper-LICENSE
          cd dist/engines
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload engine build artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-amd64-vulkan-v1.9.4
          path: dist/engines/*
          if-no-files-found: error
          retention-days: 30

      - name: Explain next step
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Linux Whisper engine ready
          Download **whisper-linux-amd64-vulkan-v1.9.4** from this run's **Artifacts** section.
          Extract the artifact ZIP to get the engine archive and its SHA-256 file.
          Save both files in the workspace folder you want to publish on GitHub.
          The engine archive contains `whisper-cli` and its upstream license.
          Target: Linux x86-64, glibc 2.35+, CPU and Vulkan backends.
          After the files are on GitHub, provide their download link so the Linux build can reuse them.
          This temporary workflow can then be removed.
          EOF
